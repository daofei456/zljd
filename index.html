<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>强制执行官 - 逼你学习</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://static.cloudbase.net/js/wx-cloudbaselib/1.3.0/wx-cloudbaselib.js"></script>
</head>
<body>
    <!-- 主界面 -->
    <div id="app">
        <!-- 拟真自习室界面 -->
        <div id="studyRoom" class="active">
            <div class="room-background">
                <div class="study-decoration"></div>
            </div>
            
            <div class="timer-display">
                <div class="timer-wrapper">
                    <div id="countdown" class="countdown">25:00</div>
                    <div class="timer-subtitle">专注时间</div>
                </div>
            </div>

            <div class="time-selector">
                <button class="time-btn active" data-time="25">25分</button>
                <button class="time-btn" data-time="45">45分</button>
                <button class="time-btn" data-time="60">60分</button>
            </div>

            <div class="action-buttons">
                <button id="startBtn" class="btn-primary">入座学习</button>
                <button id="stopBtn" class="btn-secondary hidden">结束学习</button>
            </div>

            <!-- 白噪音选择器 -->
            <div class="sound-selector">
                <div class="sound-title">🎵 专注音效</div>
                <div class="sound-options">
                    <button class="sound-btn active" data-sound="none">静音</button>
                    <button class="sound-btn" data-sound="rain">🌧️ 雨声</button>
                    <button class="sound-btn" data-sound="library">📚 图书馆</button>
                    <button class="sound-btn" data-sound="cafe">☕ 咖啡馆</button>
                </div>
            </div>

            <!-- 日历切换按钮 -->
            <div class="calendar-toggle">
                <button id="showCalendar" class="btn-secondary">📅 学习日历</button>
                <button id="showGroups" class="btn-secondary">👥 学习小组</button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="todayTime">0</span>
                    <span class="stat-label">今日时长</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="escapeCount">0</span>
                    <span class="stat-label">逃跑次数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="completeCount">0</span>
                    <span class="stat-label">完成次数</span>
                </div>
            </div>
        </div>

        <!-- 毒舌弹窗 -->
        <div id="devilDialog" class="dialog-overlay hidden">
            <div class="dialog-box">
                <div id="dialogAvatar" class="dialog-avatar">👿</div>
                <div class="dialog-content">
                    <p id="dialogText"></p>
                </div>
                <button id="dialogClose" class="dialog-btn">知道了</button>
            </div>
        </div>

        <!-- 小组界面 -->
        <div id="groupsModal" class="modal-overlay hidden">
            <div class="groups-container">
            <div class="groups-header">
                <h2>我的学习小组</h2>
                <div class="header-actions">
                    <button id="joinGroup" class="btn-secondary" style="margin-right: 10px;">加入小组</button>
                    <button id="createGroup" class="btn-primary">创建小组</button>
                </div>
            </div>
            
            <div id="joinedGroups" class="groups-list">
                    <div class="empty-groups">
                        <div class="empty-icon">👥</div>
                        <div class="empty-text">你还没有加入任何小组</div>
                        <div class="empty-hint">创建或加入小组，和小伙伴一起学习吧！</div>
                    </div>
                </div>
                
                <div class="group-ranking" style="display: none;">
                    <h3>🏆 小组排行榜</h3>
                    <div id="groupRankingList" class="ranking-list"></div>
                </div>
                
                <button id="closeGroups" class="btn-secondary">关闭</button>
            </div>
        </div>

        <!-- 小组详情界面 -->
        <div id="groupDetailModal" class="modal-overlay hidden">
            <div class="group-detail-container">
                <div class="group-detail-header">
                    <div class="group-info">
                        <h2 id="groupName">学习小组</h2>
                        <div class="group-stats">0/10人 · 今日0分钟</div>
                    </div>
                    <div class="group-actions">
                        <button id="shareGroup" class="btn-primary">邀请成员</button>
                    </div>
                </div>
                
                <div class="members-status">
                    <h3>成员状态</h3>
                    <div id="membersList" class="members-list">
                        <div class="empty-members">
                            <div class="empty-icon">📚</div>
                            <div class="empty-text">还没有成员加入</div>
                        </div>
                    </div>
                </div>
                
                <div class="group-feed">
                    <h3>小组动态</h3>
                    <div id="groupActivities" class="activities-list"></div>
                </div>
                
                <button id="closeGroupDetail" class="btn-secondary">返回</button>
            </div>
        </div>

        <!-- 创建小组弹窗 -->
        <div id="createGroupModal" class="modal-overlay hidden">
            <div class="create-group-container">
                <h2>创建学习小组</h2>
                <div class="form-group">
                    <label>小组名称</label>
                    <input type="text" id="groupNameInput" placeholder="例如：考研必胜小队" maxlength="20">
                </div>
                <div class="form-group">
                    <label>小组描述</label>
                    <textarea id="groupDescInput" placeholder="介绍一下你们的小组..." maxlength="100" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>人数上限</label>
                    <select id="groupMaxMembers">
                        <option value="5">5人</option>
                        <option value="10" selected>10人</option>
                        <option value="20">20人</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button id="confirmCreateGroup" class="btn-primary">创建</button>
                    <button id="cancelCreateGroup" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 加入小组弹窗 -->
        <div id="joinGroupModal" class="modal-overlay hidden">
            <div class="join-group-container">
                <h2>加入学习小组</h2>
                <div class="form-group">
                    <label>邀请码</label>
                    <input type="text" id="joinCodeInput" placeholder="请输入6位邀请码" maxlength="6">
                </div>
                <div class="form-actions">
                    <button id="confirmJoinGroup" class="btn-primary">加入</button>
                    <button id="cancelJoinGroup" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 日历界面 -->
        <div id="calendarModal" class="modal-overlay hidden">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth" class="calendar-nav">‹</button>
                    <div id="currentMonth" class="current-month"></div>
                    <button id="nextMonth" class="calendar-nav">›</button>
                </div>
                <div class="calendar-grid">
                    <div class="calendar-weekday">日</div>
                    <div class="calendar-weekday">一</div>
                    <div class="calendar-weekday">二</div>
                    <div class="calendar-weekday">三</div>
                    <div class="calendar-weekday">四</div>
                    <div class="calendar-weekday">五</div>
                    <div class="calendar-weekday">六</div>
                </div>
                <div id="calendarDays" class="calendar-days"></div>
                <div class="calendar-legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #333;"></div>
                        <span>未学习</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4a90e2;"></div>
                        <span>&lt;30分</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7b68ee;"></div>
                        <span>30-60分</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff6b6b;"></div>
                        <span>60-90分</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffc864;"></div>
                        <span>≥90分</span>
                    </div>
                </div>
                <button id="closeCalendar" class="btn-secondary">关闭</button>
            </div>
        </div>

        <!-- 每日打卡弹窗 -->
        <div id="dailyCheckinModal" class="modal-overlay hidden">
            <div class="checkin-container">
                <div class="checkin-header">
                    <div class="checkin-date" id="checkinDate"></div>
                    <div class="checkin-streak" id="checkinStreak"></div>
                </div>
                <div class="checkin-quote" id="dailyQuote"></div>
                <div class="checkin-actions">
                    <button id="generateDailyPoster" class="btn-primary">生成打卡海报</button>
                    <button id="closeDailyCheckin" class="btn-secondary">关闭</button>
                </div>
            </div>
        </div>

        <!-- 海报生成界面 -->
        <div id="posterModal" class="modal-overlay hidden">
            <div class="poster-container">
                <canvas id="posterCanvas"></canvas>
                <div class="poster-actions">
                    <button id="downloadPoster" class="btn-primary">保存海报</button>
                    <button id="closePoster" class="btn-secondary">关闭</button>
                </div>
            </div>
        </div>

        <!-- 科目选择弹窗 -->
        <div id="subjectModal" class="modal-overlay hidden">
            <div class="modal-box">
                <h3 class="modal-title">选择学习科目</h3>
                <div class="subject-grid">
                    <button class="subject-btn" data-subject="数学">📐 数学</button>
                    <button class="subject-btn" data-subject="英语">📚 英语</button>
                    <button class="subject-btn" data-subject="政治">🏛️ 政治</button>
                    <button class="subject-btn" data-subject="专业课">📖 专业课</button>
                    <button class="subject-btn" data-subject="综合">🔍 综合</button>
                    <button class="subject-btn" data-subject="其他">✏️ 其他</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
